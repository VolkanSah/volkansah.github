    overflow: auto !important; /* Scrollable if necessary */
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.7) !important; /* Soft drop shadow */
}

/* Styling for actual code lines */
.highlight pre {
    background-color: transparent !important; /* No background for pre tag */
    color: inherit !important; /* Inherits the parent element's color */
    font-family: 'Fira Code', monospace !important; /* Monospace font for code */

}

/* Styling for specific elements within the code */

<script>
/* Load README — preserve user's ToC, patch its links to our heading IDs */
function loadReadme(repoFullName, index) {
  fetch(`https://api.github.com/repos/${repoFullName}/readme`, {
    headers: { 'Accept': 'application/vnd.github.v3.html' }
  })
  .then(response => response.text())
  .then(data => {
    // Fix relative image src → raw.githubusercontent
    const repoUrl = `https://raw.githubusercontent.com/${repoFullName}/master/`;
    data = data.replace(/src="([^"]+)"/g, (match, p1) => {
      if (!p1.startsWith('http') && !p1.startsWith('//')) return `src="${repoUrl}${p1}"`;
      return match;
    });

    // Strip GitHub's anchor wrappers INSIDE headings only
    // <h2><a id="user-content-xyz" href="#xyz"></a> Text</h2> → <h2>Text</h2>
    // But we need to remember the original GitHub slug → for ToC link patching below
    // So we do this in the DOM pass instead of on the string
    
    // Strip link wrappers around images — keep <img>, drop <a>
    data = data.replace(/<a[^>]*>\s*(<img[^>]*\/?>)\s*<\/a>/gi, '$1');

    const container = document.getElementById(`repoContent-${index}`);
    container.innerHTML = data;

    // --- DOM pass ---
    // Build a map: GitHub slug → our new heading ID
    const slugMap = {};
    const headings = container.querySelectorAll('h1,h2,h3,h4,h5');

    headings.forEach((h, i) => {
      // Grab GitHub's original slug from the inner <a id="user-content-...">
      const innerAnchor = h.querySelector('a[id]');
      if (innerAnchor) {
        const githubSlug = innerAnchor.id.replace(/^user-content-/, '');
        // Remove the anchor wrapper, keep heading text clean
        innerAnchor.replaceWith(...innerAnchor.childNodes);
        slugMap[githubSlug] = null; // fill in after we assign the new ID
      }

      // Assign our own clean ID to the heading element
      const slug = h.textContent.trim()
        .toLowerCase()
        .replace(/[^\w\s-]/g, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-');
      const newId = `repoContent-${index}-${i + 1}-${slug}`;
      h.id = newId;

      // Map GitHub slug → new ID (re-derive the same slug GitHub would use)
      const githubDerivedSlug = h.textContent.trim()
        .toLowerCase()
        .replace(/[^\w\s-]/g, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-');
      slugMap[githubDerivedSlug] = newId;

      // Also map numeric variants GitHub sometimes uses (slug-1, slug-2)
      // covered by the anchor extraction above if present
    });

    // Fill slugMap entries we captured from the inner anchors
    headings.forEach((h, i) => {
      const slug = h.id.replace(new RegExp(`^repoContent-${index}-${i+1}-`), '');
      // Already set above — just ensure nothing is null
    });

    // Patch ALL internal anchor links in the container (ToC links, cross-refs)
    container.querySelectorAll('a[href^="#"]').forEach(a => {
      const raw = a.getAttribute('href').replace(/^#/, '').replace(/^user-content-/, '');
      const newId = slugMap[raw];
      if (newId) {
        a.setAttribute('href', '#' + newId);
        a.addEventListener('click', function(e) {
          e.preventDefault();
          scrollModalTo(`repoContent-${index}`, newId);
        });
      } else {
        // Unknown anchor — just prevent page jump
        a.addEventListener('click', function(e) { e.preventDefault(); });
      }
    });

    // Hand off to modal-render-math.js for MathJax/KaTeX
    insertReadmeHtmlAndRender(container.innerHTML, container);
  })
  .catch(() => {
    document.getElementById(`repoContent-${index}`).innerHTML = '<p>README could not be loaded.</p>';
  });
}

// Scroll anchor target into view inside modal-body
function scrollModalTo(modalBodyId, targetId) {
  const modalBody = document.getElementById(modalBodyId);
  const target = document.getElementById(targetId);
  if (!modalBody || !target) return;
  // target.offsetTop is relative to its offsetParent, walk up to modalBody
  let top = 0;
  let el = target;
  while (el && el !== modalBody) {
    top += el.offsetTop;
    el = el.offsetParent;
  }
  modalBody.scrollTo({ top: top - 16, behavior: 'smooth' });
}

// Typewriter effect for nav links
// Adjust SPEED here (ms per character) ↓
const TYPEWRITER_SPEED = 55;

document.addEventListener('DOMContentLoaded', function () {
  const spans = document.querySelectorAll('.nav-link-type');
  let globalDelay = 120; // initial delay before first link starts typing

  spans.forEach(function (span) {
    const text = span.textContent.trim();
    span.textContent = '';
    span.style.width = '0';

    // Measure natural width without affecting layout
    const ghost = document.createElement('span');
    ghost.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font:inherit;';
    ghost.textContent = text;
    document.body.appendChild(ghost);
    const fullWidth = ghost.offsetWidth;
    document.body.removeChild(ghost);

    let charIndex = 0;
    const startDelay = globalDelay;

    setTimeout(function type() {
      if (charIndex < text.length) {
        span.textContent += text[charIndex];
        // Animate width so the reveal looks natural
        span.style.width = ((charIndex + 1) / text.length * fullWidth) + 'px';
        charIndex++;
        setTimeout(type, TYPEWRITER_SPEED);
      } else {
        span.style.width = fullWidth + 'px';
        span.classList.add('typing-done');
      }
    }, startDelay);

    // Next link starts after this one finishes + small gap
    globalDelay += text.length * TYPEWRITER_SPEED + 180;
  });
});
</script>
